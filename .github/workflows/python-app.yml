
name: Build AliTube for Windows

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download and verify FFmpeg
        shell: pwsh
        run: |
          ./installer/fetch_ffmpeg.ps1
          if (!(Test-Path "installer/ffmpeg/ffmpeg.exe")) {
            throw "FFmpeg was not found"
          }
          if (!(Test-Path "installer/ffmpeg/ffprobe.exe")) {
            throw "FFprobe was not found"
          }

      - name: Run tests
        run: |
          python -m pytest

      - name: Build AliTube
        run: |
          python -m PyInstaller --noconfirm --clean AliTube.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AliTube-Windows
          path: dist/AliTube.exe
          if-no-files-found: error
